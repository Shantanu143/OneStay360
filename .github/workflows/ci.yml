name: OneStay360 CI/CD Pipeline

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging]

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  # ─── Cloud Functions Tests ──────────────────────────────────────────────────
  functions-test:
    name: Cloud Functions Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Security audit
        run: npm audit --audit-level moderate
        working-directory: functions

      - name: Build TypeScript
        run: npm run build
        working-directory: functions

      - name: Run unit tests
        run: npm test -- --coverage --testPathPattern="test/unit"
        working-directory: functions
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          directory: functions/coverage
          flags: functions

  # ─── Business App Tests ─────────────────────────────────────────────────────
  business-app-test:
    name: Business App Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: apps/business

      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        working-directory: apps/business

      - name: Run unit tests
        run: flutter test test/unit --coverage
        working-directory: apps/business

      - name: Run widget tests
        run: flutter test test/widget
        working-directory: apps/business

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          directory: apps/business/coverage
          flags: business-app

  # ─── Tenant App Tests ───────────────────────────────────────────────────────
  tenant-app-test:
    name: Tenant App Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: apps/tenant

      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        working-directory: apps/tenant

      - name: Run unit tests
        run: flutter test test/unit --coverage
        working-directory: apps/tenant

      - name: Run widget tests
        run: flutter test test/widget
        working-directory: apps/tenant

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          directory: apps/tenant/coverage
          flags: tenant-app

  # ─── Shared Packages Tests ──────────────────────────────────────────────────
  packages-test:
    name: Shared Packages Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Test models package
        run: |
          flutter pub get
          flutter test
        working-directory: packages/models

      - name: Test firebase_services package
        run: |
          flutter pub get
          flutter test
        working-directory: packages/firebase_services

  # ─── Deploy to Staging ──────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    needs: [functions-test, business-app-test, tenant-app-test, packages-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Staging
        run: |
          firebase use staging --token ${{ secrets.FIREBASE_TOKEN }}
          firebase deploy --only functions,firestore:rules,storage,firestore:indexes --token ${{ secrets.FIREBASE_TOKEN }}

  # ─── Deploy to Production ───────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    needs: [functions-test, business-app-test, tenant-app-test, packages-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Production
        run: |
          firebase use production --token ${{ secrets.FIREBASE_TOKEN }}
          firebase deploy --only functions,firestore:rules,storage,firestore:indexes --token ${{ secrets.FIREBASE_TOKEN }}

      - name: Notify deployment
        if: success()
        run: echo "✅ Production deployment successful"
