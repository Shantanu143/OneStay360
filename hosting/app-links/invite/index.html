<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OneStay360 Invite</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 24px; max-width: 420px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
    h1 { margin: 0 0 12px; font-size: 20px; }
    p { margin: 0 0 12px; line-height: 1.5; }
    code { background: #1f2937; padding: 2px 6px; border-radius: 6px; font-size: 13px; }
    .btn { display: inline-block; margin-top: 12px; padding: 12px 16px; background: #0f766e; color: #e2e8f0; text-decoration: none; border-radius: 10px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Open in OneStay360</h1>
    <p>If the app is installed, this link should open directly in the OneStay360 Business app. If it didn't, please install or open the app from the Play Store below.</p>
    <p id="invite"></p>
    <a class="btn" id="store" href="https://play.google.com/store/apps/details?id=com.onestay360.business">Open Play Store</a>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const inviteId = params.get('inviteId');
      if (inviteId) {
        document.getElementById('invite').textContent = 'Invite ID: ' + inviteId;
      }
    })();
  </script>
</body>
</html>
